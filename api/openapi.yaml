# OpenAPI 3.1 specification
openapi: 3.1.0
title: AI Software Factory API
version: 1.0.0
description: An API for generating SQL queries based on natural language questions.
servers:
  - url: http://localhost:8000
paths:
  /query:
    post:
      summary: Generate a SQL query from a natural language question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalLanguageQuery'
      responses:
        '200':
          description: Successful response with generated SQL and explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedSQLResponse'
        '400':
          description: Bad request - invalid input or query would write/delete data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    NaturalLanguageQuery:
      type: object
      properties:
        question:
          type: string
          example: 'How many orders were placed in the last month?'
    GeneratedSQLResponse:
      type: object
      properties:
        sql:
          type: string
          format: sql
          example: 'SELECT COUNT(*) FROM orders WHERE order_date >= DATE_SUB(CURDATE(), INTERVAL 1 MONTH)'
        explanation:
          type: string
          example: 'This query counts the number of orders placed in the last month by filtering on the order_date column.'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: 'Invalid input or query would write/delete data'
